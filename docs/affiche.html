<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiche Momo Foot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
  /* Affiche A4 à imprimer ou à envoyer en image : le QR code renvoie vers l'appli. */
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0B3F2A; }
  body { font-family: "Barlow", Arial, sans-serif; color: #F4FFF8; display: flex; justify-content: center; }
  .poster { width: 210mm; min-height: 297mm; max-width: 100%; padding: 16mm 14mm; display: flex; flex-direction: column; align-items: center; gap: 8mm; position: relative; overflow: hidden; background: #0B3F2A; }
  .poster > svg.pitch { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .14; }
  .poster > * { position: relative; }
  .crest { width: 30mm; height: 30mm; }
  h1 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(48px, 11vw, 96px); line-height: .9; margin: 0; text-align: center; }
  h1 em { font-style: normal; color: #E9601A; }
  .lead { font-size: clamp(18px, 3.4vw, 26px); font-weight: 600; text-align: center; max-width: 30ch; margin: 0; }
  .qr { background: #FFFFFF; border-radius: 6mm; padding: 6mm; width: min(110mm, 80vw); }
  .qr svg { display: block; width: 100%; height: auto; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; width: 100%; max-width: 170mm; }
  .steps div { border: 2px solid rgba(244, 255, 248, .3); border-radius: 4mm; padding: 4mm; text-align: center; }
  .steps b { display: block; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: clamp(22px, 4vw, 34px); color: #E9601A; text-transform: uppercase; }
  .steps span { font-size: clamp(13px, 2.2vw, 16px); }
  .url { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: clamp(18px, 3.4vw, 26px); letter-spacing: .02em; }
  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  @media (max-width: 500px) { .steps { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="poster">
  <svg class="pitch" viewBox="0 0 210 297" preserveAspectRatio="none" fill="none" stroke="#fff" stroke-width="1.2"><rect x="8" y="8" width="194" height="281" rx="3"/><path d="M8 148.5h194"/><circle cx="105" cy="148.5" r="26"/><path d="M60 8v34h90V8M60 289v-34h90v34"/></svg>
  <svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 36 8v12c0 9-7 15-16 18C11 35 4 29 4 20V8z" fill="#E9601A"/><path d="M20 6 32 10.5V20c0 7-5.5 11.8-12 14.2C13.5 31.8 8 27 8 20v-9.5z" fill="#0B3F2A"/><text x="20" y="25" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="13" fill="#F4FFF8">MF</text></svg>
  <h1 id="title">FC Momo <em>Foot</em></h1>
  <p class="lead" id="lead"></p>
  <div class="qr" id="qr"></div>
  <div class="steps">
    <div><b>Scanne</b><span>avec l'appareil photo du téléphone</span></div>
    <div><b>Installe</b><span>« Ajouter à l'écran d'accueil »</span></div>
    <div><b>Joue</b><span>réserve ou inscris-toi seul</span></div>
  </div>
  <div class="url" id="url"></div>
</div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
  const C = window.MOMO_CONFIG, url = C.urlAppli || location.href.replace(/affiche\.html.*$/, "");
  const q = qrcode(0, "M"); q.addData(url); q.make();
  document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 8, margin: 1, scalable: true });
  document.getElementById("lead").textContent = `Pas d'équipe ? Inscris-toi seul : à ${C.sessions.minJoueurs} joueurs, on joue. ${C.sessions.prixJoueur.toLocaleString("fr-FR").replace(/ | /g, " ")} F la place.`;
  document.getElementById("url").textContent = url.replace(/^https?:\/\//, "");
  const parts = C.nom.split(" "); document.getElementById("title").innerHTML = `${parts.slice(0, -1).join(" ")} <em>${parts.slice(-1)}</em>`;
</script>
</body>
</html>
